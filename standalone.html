    // --- Web Audio API Sound Synthesizer ---
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
      }

      initCtx() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      setMuted(muted) { this.isMuted = muted; }
      getMuted() { return this.isMuted; }

      playCorrect() {
        if (this.isMuted) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.2, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.35);
          });
        } catch (e) {}
      }

      playIncorrect() {
        if (this.isMuted) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(380, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.25);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        } catch (e) {}
      }

      playClick() {
        if (this.isMuted) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(400, now + 0.06);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.06);
        } catch (e) {}
      }

      playTick() {
        if (this.isMuted) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.04);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        } catch (e) {}
      }

      playTimeout() {
        if (this.isMuted) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.setValueAtTime(240, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        } catch (e) {}
      }

      playCountdownBeep(isFinal = false) {
        if (this.isMuted) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = isFinal ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(isFinal ? 1046.5 : 587.33, now);
          gain.gain.setValueAtTime(isFinal ? 0.3 : 0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + (isFinal ? 0.4 : 0.18));
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + (isFinal ? 0.4 : 0.18));
        } catch (e) {}
      }

      playFanfare() {
        if (this.isMuted) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [
            { f: 523.25, d: 0.12 },
            { f: 523.25, d: 0.12 },
            { f: 523.25, d: 0.12 },
            { f: 659.25, d: 0.25 },
            { f: 783.99, d: 0.2 },
            { f: 1046.5, d: 0.5 },
          ];
          let elapsed = 0;
          notes.forEach(note => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(note.f, now + elapsed);
            gain.gain.setValueAtTime(0.25, now + elapsed);
            gain.gain.exponentialRampToValueAtTime(0.001, now + elapsed + note.d);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + elapsed);
            osc.stop(now + elapsed + note.d);
            elapsed += note.d * 0.9;
          });
        } catch (e) {}
      }
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getRandom10Questions() {
      const e = shuffleArray(QUESTION_BANK.easy).slice(0, 3);
      const m = shuffleArray(QUESTION_BANK.medium).slice(0, 3);
      const h = shuffleArray(QUESTION_BANK.hard).slice(0, 4);
      return [...e, ...m, ...h].map((q, idx) => ({
        ...q,
        id: idx + 1,
        difficulty: idx < 3 ? '하' : idx < 6 ? '중' : '상',
      }));
    }

    // --- Interactive 3D Block Sandbox ---
    function BlockSandbox() {
      const [grid, setGrid] = useState([
        [1, 2, 0],
        [3, 1, 0],
        [0, 1, 2],
      ]);

      const totalBlocks = useMemo(() => {
        return grid.reduce((sum, row) => sum + row.reduce((rSum, v) => rSum + v, 0), 0);
      }, [grid]);

      const handleCellClick = (r, c) => {
        sound.playClick();
        setGrid(prev => {
          const next = prev.map(row => [...row]);
          next[r][c] = (next[r][c] + 1) % 4; // 0 -> 1 -> 2 -> 3 -> 0
          return next;
        });
      };

      const handleReset = () => {
        sound.playClick();
        setGrid([
          [0, 0, 0],
          [0, 0, 0],
          [0, 0, 0],
        ]);
      };

      // Calculate Front View (Max height of each column r: 0..2)
      const frontView = useMemo(() => {
        const cols = [0, 1, 2];
        return cols.map(c => Math.max(grid[0][c], grid[1][c], grid[2][c]));
      }, [grid]);

      // Calculate Side View (Max height of each row from right to left)
      const sideView = useMemo(() => {
        return [0, 1, 2].map(r => Math.max(...grid[r]));
      }, [grid]);

      return (
        <div className="w-full max-w-3xl bg-white rounded-3xl sm:rounded-4xl p-6 sm:p-8 shadow-2xl border-6 border-amber-300">
          <div className="flex items-center justify-between pb-4 border-b-2 border-amber-100">

              <h2 className="text-xl sm:text-2xl font-black text-slate-900 mt-1">
                🧊 쌓기나무 3D 실험실

            <button
              onClick={handleReset}
              className="px-3 py-1.5 rounded-xl border border-slate-300 hover:bg-rose-50 hover:text-rose-600 text-xs font-black cursor-pointer"
            >
              모두 비우기 🔄
            </button>
          </div>

          <p className="text-xs sm:text-sm font-bold text-slate-600 my-3">
            칸을 클릭할 때마다 <strong>1층 ➡️ 2층 ➡️ 3층 ➡️ 0층</strong>으로 블록이 쌓입니다. 아래 위·앞·옆 모양 변화를 확인해보세요!

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 my-4">
            {/* Grid clicker */}

              <span className="text-xs font-black text-amber-900 mb-2">
                ⬇️ 위에서 본 모양 (클릭하여 층수 조절)
              </span>
              <div className="grid grid-cols-3 gap-2 bg-white p-3 rounded-2xl border-2 border-amber-300 shadow-sm">
                {grid.map((row, r) =>
                  row.map((val, c) => (
                    <button
                      key={`${r}-${c}`}
                      onClick={() => handleCellClick(r, c)}
                      className={`w-14 h-14 sm:w-16 sm:h-16 rounded-xl font-black text-2xl flex items-center justify-center cursor-pointer transition-all border-2 ${
                        val === 0
                          ? 'bg-slate-50 text-slate-300 border-dashed border-slate-300 hover:bg-amber-100/50'
                          : val === 1
                          ? 'bg-emerald-400 text-white border-emerald-500 shadow-xs'

                          ? 'bg-sky-500 text-white border-sky-600 shadow-xs'

            <div className="flex flex-col justify-around gap-4 p-4 bg-slate-50 rounded-2xl border-2 border-slate-200">

    // --- Main Single-File Quiz Application ---
    function App() {
      const [gamePhase, setGamePhase] = useState('ready'); // 'ready' | 'countdown' | 'playing' | 'completed'
      const [questions, setQuestions] = useState(() => getRandom10Questions());
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [answers, setAnswers] = useState([]);
      const [activeTab, setActiveTab] = useState('quiz');
      const [timeLeft, setTimeLeft] = useState(15);
      const [isFeedbackOpen, setIsFeedbackOpen] = useState(false);
      const [currentUserAnswer, setCurrentUserAnswer] = useState('O');
      const [isMuted, setIsMuted] = useState(false);
      const [countdownNumber, setCountdownNumber] = useState(3);

      const currentQ = questions[currentIndex];

      // 15-Second Timer Hook
      useEffect(() => {
        if (gamePhase !== 'playing' || activeTab !== 'quiz' || isFeedbackOpen) return;

        if (timeLeft <= 0) {
          handleTimeout();
          return;
        }

        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) return 0;
            if (prev <= 6 && prev > 1) sound.playTick();
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timer);
      }, [gamePhase, activeTab, isFeedbackOpen, timeLeft]);

      // 3-2-1 Countdown Timer Hook
      useEffect(() => {
        if (gamePhase !== 'countdown') return;

        sound.playCountdownBeep(false);
        setCountdownNumber(3);

        const timer = setInterval(() => {
          setCountdownNumber(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              sound.playCountdownBeep(true);
              setTimeout(() => {
                setTimeLeft(15);
                setGamePhase('playing');
              }, 600);
              return 0; // "출발!"
            }
            sound.playCountdownBeep(false);
            return prev - 1;
          });
        }, 900);

        return () => clearInterval(timer);
      }, [gamePhase]);

      const handleTimeout = () => {
        if (isFeedbackOpen || !currentQ) return;
        sound.playTimeout();
        setCurrentUserAnswer('TIMEOUT');
        setAnswers(prev => [
          ...prev,
          { questionId: currentQ.id, userAnswer: 'TIMEOUT', isCorrect: false, scoreEarned: 0, isTimeout: true }
        ]);
        setIsFeedbackOpen(true);
      };

      const handleAnswer = (ans) => {
        if (isFeedbackOpen || !currentQ || gamePhase !== 'playing') return;
        const isCorrect = ans === currentQ.answer;
        setCurrentUserAnswer(ans);

        if (isCorrect) {
          sound.playCorrect();
          setScore(s => s + 100);
          confetti({
            particleCount: 40,
            spread: 60,
            origin: { y: 0.65 }
          });
        } else {
          sound.playIncorrect();
        }

        setAnswers(prev => [
          ...prev,
          { questionId: currentQ.id, userAnswer: ans, isCorrect, scoreEarned: isCorrect ? 100 : 0 }
        ]);
        setIsFeedbackOpen(true);
      };

      const handleNextQuestion = () => {
        setIsFeedbackOpen(false);
        setTimeLeft(15);

        if (currentIndex + 1 < questions.length) {
          setCurrentIndex(i => i + 1);
        } else {
          setGamePhase('completed');
          sound.playFanfare();
          confetti({ particleCount: 100, spread: 100, origin: { y: 0.5 } });
        }
      };

      const handleStartGame = () => {
        sound.playClick();
        setCurrentIndex(0);
        setScore(0);
        setAnswers([]);
        setIsFeedbackOpen(false);
        setGamePhase('countdown');
      };

      const handleNewBankGame = () => {
        sound.playClick();
        setQuestions(getRandom10Questions());
        setCurrentIndex(0);
        setScore(0);
        setAnswers([]);
        setIsFeedbackOpen(false);
        setGamePhase('countdown');
      };

                    <span className="shrink-0 text-amber-600">⭐ 핵심 요약:</span>
                    <span>{currentQ.keyTakeaway}</span>
                  </div>
                </div>

                <button
                  onClick={handleNextQuestion}
                  autoFocus
                  className="w-full py-4 px-8 mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xl rounded-2xl shadow-[0_8px_0_#3730a3] active:translate-y-1.5 active:shadow-[0_2px_0_#3730a3] cursor-pointer"
                >
                  {currentIndex + 1 === questions.length ? '최종 결과 확인하기 🏆' : '다음 문제로 가기 ▶'}
                </button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="w-full py-4 text-center text-xs font-bold text-slate-500 border-t border-amber-200 bg-white/50">
            보림초 6학년 2반 수학 · 2단원 공간과 입체 OX 퀴즈 게임 (GitHub Pages 호환 단일 HTML 버전)
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
